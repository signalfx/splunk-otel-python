name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  run:
    name: Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Hatch
      run: pip install --upgrade hatch==1.17.0

    - name: Run static analysis
      run: hatch fmt --check

    - name: Run unit tests with coverage
      run: hatch run cov

    - name: Install oteltest
      run: pip install 'oteltest>=0.49.0'

    - name: Run oteltests
      run: oteltest tests/integration/*.py

  postgresql-smoke:
    name: PostgreSQL trace-context smoke test (Python ${{ matrix.python-version }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [auto, manual, disabled]
        python-version: ['3.10', '3.14']
    env:
      POSTGRESQL_SMOKE_INSTRUMENTATION: ${{ matrix.mode }}
      SPLUNK_POSTGRESQL_TRACE_CONTEXT_PROPAGATION_ENABLED: ${{ matrix.mode != 'disabled' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: otel
          POSTGRES_USER: otel
          POSTGRES_PASSWORD: otel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otel -d otel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install smoke-test dependencies
      run: >-
        pip install . "psycopg[binary]" psycopg2-binary
        opentelemetry-instrumentation-psycopg
        opentelemetry-instrumentation-psycopg2

    - name: Run PostgreSQL smoke test
      timeout-minutes: 5
      run: python tests/smoke/postgresql_trace_context.py
