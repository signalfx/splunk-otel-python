default:
  image: 'python:3.11-slim'

include:
  - project: core-ee/signing/api-integration
    # Keep this pinned to an immutable commit. To update, choose a reviewed commit
    # from core-ee/signing/api-integration and validate this CI config in GitLab.
    ref: addd76a1d97a8b19db80f40fe4f7830d2374303d
    file: /templates/.sign-client.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG

stages:
  - build
  - sign
  - deploy
  - post-release

build-job:
  stage: build
  before_script:
    - ./docker/install-docker-deps.sh
    - apt-get install -y zip unzip
  script:
    - pip install hatch
    - hatch build
    - mkdir -p buildpack-dist
    - ./deployments/cloudfoundry/buildpack/build.sh buildpack-dist/splunk_otel_python_buildpack-linux.zip dist/splunk_opentelemetry-*.whl
    - ./tests/smoke/test-cloudfoundry-buildpack.sh buildpack-dist/splunk_otel_python_buildpack-linux.zip
  artifacts:
      paths:
        - dist/
        - buildpack-dist/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'

buildpack-signing-job:
  stage: sign
  extends: .submit-signing-request
  needs:
    - build-job
  variables:
    ARTIFACT: buildpack-dist/splunk_otel_python_buildpack-linux.zip
    SIGN_TYPE: GPG
    DOWNLOAD_DIR: buildpack-dist
  artifacts:
    paths:
      - buildpack-dist/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'

release-checksums-job:
  stage: sign
  needs:
    - build-job
    - buildpack-signing-job
  script:
    - sha256sum dist/*.whl dist/*.tar.gz buildpack-dist/*.zip buildpack-dist/*.zip.asc > dist/checksums.txt
  artifacts:
    paths:
      - dist/
      - buildpack-dist/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'

checksum-signing-job:
  stage: sign
  extends: .submit-signing-request
  needs:
    - release-checksums-job
  variables:
    ARTIFACT: dist/checksums.txt
    SIGN_TYPE: GPG
    DOWNLOAD_DIR: dist
    LOGLEVEL: DEBUG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  artifacts:
    paths:
      - dist/
      - buildpack-dist/

deploy-job:
  stage: deploy
  script:
    - pip install hatch keyrings.alt
    - hatch --no-interactive publish
  needs:
    - checksum-signing-job
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false

# The publish script builds and pushes both the standard image and the
# SecureApp image variant from the same release tag.
publish-docker-image:
  stage: post-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  variables:
    SIGNING_SERVICE_ADDR: "https://signing.prod.svc.splunk8s.io"
  id_tokens:
    CI_JOB_JWT:
      aud:
        - $CICD_VAULT_ADDR
        - $SIGNING_SERVICE_ADDR
  before_script:
    - ./docker/install-docker-deps.sh
    - ./docker/install-gh-deps.sh
    # Let this AMD64 runner execute ARM64 programs during cross-platform builds.
    # The helper registers QEMU as the ARM64 interpreter through Linux binfmt_misc.
    - docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
    - docker buildx create --driver docker-container --name "multiarch-${CI_JOB_ID}" --use
    - docker buildx inspect --bootstrap
  script:
    - ./docker/publish-docker-image.sh "$CI_COMMIT_TAG"
  after_script:
    - docker buildx rm "multiarch-${CI_JOB_ID}" || true
